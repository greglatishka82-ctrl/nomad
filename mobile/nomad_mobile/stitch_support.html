<script>
        // Simple interaction for the input
        const input = document.querySelector('input');
        const sendBtn = document.querySelector('footer button.bg-accent');
        
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && input.value.trim() !== '') {
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);

        function sendMessage() {
            const text = input.value.trim();
            if (!text) return;

            const chatArea = document.querySelector('main');
            const now = new Date();
            const time = `${now.getHours()}:${now.getMinutes().toString().padStart(2, '0')}`;

            const msgHtml = `
                <div class="flex flex-col items-end gap-1 max-w-[85%] self-end animate-in fade-in slide-in-from-bottom-2 duration-300">
                    <div class="bg-accent text-white px-4 py-3 rounded-2xl rounded-tr-none shadow-sm">
                        <p class="text-sm font-medium leading-relaxed">${text}</p>
                    </div>
                    <span class="text-[10px] font-medium text-on-surface-variant/70 mr-1">${time}</span>
                </div>
            `;

            chatArea.insertAdjacentHTML('beforeend', msgHtml);
            input.value = '';
            chatArea.scrollTo({ top: chatArea.scrollHeight, behavior: 'smooth' });
            
            // Mock automated reply

                        </div>
                    </div>
                `;
                chatArea.insertAdjacentHTML('beforeend', replyHtml);
                chatArea.scrollTo({ top: chatArea.scrollHeight, behavior: 'smooth' });
            }, 1000);
        }
