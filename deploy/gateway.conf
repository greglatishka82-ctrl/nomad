server {
  listen 80 default_server;
  server_name _;
  client_max_body_size 20m;
  location /admin/ { proxy_pass http://admin-frontend/; proxy_set_header Host $host; }
  location = /admin { return 301 /admin/; }
  location /api/admin/ { proxy_pass http://admin-api:8001/api/admin/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Real-IP $remote_addr; }
  location /api/ { proxy_pass http://site-api:8000/api/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Real-IP $remote_addr; }
  location /static/ { proxy_pass http://site-api:8000/static/; }
  location / { proxy_pass http://site-frontend/; proxy_set_header Host $host; }
}
