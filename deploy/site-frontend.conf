server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location / { try_files $uri $uri/ /index.html; }
  # Раздача APK с нашего сервера. Сам файл лежит вне образа (том downloads):
  # *.apk в .gitignore и в сборку не попадает.
  location = /nomad.apk {
    alias /usr/share/nginx/html/downloads/nomad.apk;
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition 'attachment; filename="nomad.apk"';
    add_header Cache-Control "no-store" always;
  }
  location /api/ { proxy_pass http://site-api:8000/api/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Real-IP $remote_addr; }
}
