server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location = / {
    add_header Cache-Control "no-store, max-age=0" always;
    try_files /index.html =404;
  }
  location / { try_files $uri $uri/ /index.html; }
  location /api/admin/ { proxy_pass http://admin-api:8001/api/admin/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Real-IP $remote_addr; }
}
