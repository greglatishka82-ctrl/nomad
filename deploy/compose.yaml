name: greentime
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  site-api:
    image: gt-security-site:20261120-v2
    restart: unless-stopped
    env_file: .env
    environment: {PORT: 8000, START_BOTS: "false", MOBILE_BOOKING_ENABLED: "false"}
    depends_on: {db: {condition: service_healthy}}
    volumes: [site_static:/app/app/static]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
  bot-worker:
    image: gt-events-bot:20261121-panel
    restart: unless-stopped
    env_file: .env
    environment: {START_BOTS: "true"}
    command: ["python", "bot_worker.py"]
    depends_on: {db: {condition: service_healthy}}
    volumes: [site_static:/app/app/static]
  admin-api:
    image: gt-security-admin:20261120-v2
    restart: unless-stopped
    env_file: .env
    environment: {PORT: 8001}
    depends_on: {db: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
  site-frontend:
    image: gt-wishes-site:20261121-404-v3
    restart: unless-stopped
    # APK раздаётся с диска сервера: файл не попадает в git (*.apk в .gitignore)
    # и не пересобирается вместе с образом.
    volumes:
      - ./downloads:/usr/share/nginx/html/downloads:ro
  admin-frontend:
    image: gt-wishes-admin:20261120
    restart: unless-stopped
  security-notifier:
    image: gt-security-security-bot:20261120-v2
    restart: unless-stopped
    env_file:
      - .env
      - security-bot.env
  gateway:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [site-api, admin-api, site-frontend, admin-frontend]
# Тома объявлены внешними и названы по старому проекту: данные PostgreSQL,
# загруженные файлы и сертификаты Caddy переезжают вместе со сменой имени
# проекта, ничего не пересоздаётся и не теряется.
volumes:
  postgres_data:
    name: nomad_postgres_data
    external: true
  site_static:
    name: nomad_site_static
    external: true
  caddy_data:
    name: nomad_caddy_data
    external: true
  caddy_config:
    name: nomad_caddy_config
    external: true
