<body class="bg-background text-on-background min-h-screen flex flex-col font-body-lg overflow-x-hidden">
<!-- Header (Based on TopAppBar but adapted for linear flow) -->
<header class="w-full top-0 sticky z-50 bg-background/80 backdrop-blur-md flex items-center px-container-margin h-touch-target">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary font-bold" style="font-size: 28px;">school</span>
<h1 class="font-headline-md-mobile text-headline-md-mobile font-bold text-primary tracking-tight">NOMAD Academy</h1>
</div>
</header>
<main class="flex-grow flex flex-col items-center justify-center px-container-margin py-section-gap relative">
<!-- Background Atmospheric Element -->
<div class="absolute inset-0 pointer-events-none overflow-hidden">
<div class="absolute -top-24 -right-24 w-96 h-96 bg-primary/5 rounded-full blur-3xl"></div>
<div class="absolute -bottom-24 -left-24 w-96 h-96 bg-secondary/5 rounded-full blur-3xl"></div>
</div>
<!-- Hero Graphic (Driving Academy Theme) -->
<div class="mb-8 w-full max-w-sm flex justify-center animate-float">
<div class="relative w-48 h-48 bg-surface-container-high rounded-full flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-primary" style="font-size: 84px;">directions_car</span>
<div class="absolute -bottom-2 -right-2 bg-secondary-container p-3 rounded-xl shadow-lg">
<span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 1;">verified_user</span>
</div>
</div>
</div>
<!-- Login Form Card -->
<div class="w-full max-w-md glass-panel p-8 rounded-xl shadow-[0px_4px_16px_rgba(3,22,52,0.1)] border border-outline-variant/30">
<div class="mb-6">
<h2 class="font-headline-md text-headline-md text-primary mb-2">Добро пожаловать</h2>
<p class="font-body-md text-on-surface-variant">Введите ваши данные для доступа в личный кабинет академии NOMAD.</p>
</div>
<form action="#" class="space-y-stack-gap" method="POST">
<!-- Email Field -->
<div class="relative">
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-1 ml-1" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full h-touch-target pl-12 pr-4 bg-surface-container-lowest border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary transition-all font-body-lg outline-none" id="email" name="email" placeholder="example@nomad.kz" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="relative">
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-1 ml-1" for="password">Пароль</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full h-touch-target pl-12 pr-12 bg-surface-container-lowest border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary transition-all font-body-lg outline-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="pw-icon">visibility</span>
</button>
</div>
</div>
<!-- Remember & Forgot -->
<div class="flex items-center justify-between py-2">
<label class="flex items-center group cursor-pointer">
<div class="relative">
<input class="sr-only peer" type="checkbox"/>
<div class="w-5 h-5 border-2 border-outline-variant rounded peer-checked:bg-secondary-container peer-checked:border-secondary-container transition-all flex items-center justify-center">
<span class="material-symbols-outlined text-white text-sm scale-0 peer-checked:scale-100 transition-transform">check</span>
</div>
</div>
<span class="ml-2 font-body-md text-on-surface-variant group-hover:text-primary transition-colors">Запомнить меня</span>
</label>
<a class="font-label-lg text-label-lg text-secondary font-bold hover:underline" href="#">Забыли пароль?</a>
</div>
<!-- Login Button -->
<button class="w-full h-touch-target bg-secondary-container text-white font-bold rounded-lg shadow-md hover:shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2 mt-4" type="submit">
<span>Войти в систему</span>
<span class="material-symbols-outlined">login</span>
</button>

<!-- Social Login Divider -->

                    Google
                </button>
<button class="h-touch-target flex items-center justify-center gap-2 border border-outline-variant rounded-lg font-label-lg text-primary hover:bg-surface-container-low transition-colors active:scale-95">
<span class="material-symbols-outlined text-blue-600" style="font-variation-settings: 'FILL' 1;">face_nod</span>
                    Facebook
                </button>
</div>
</div>

<div class="mt-8 text-center">
<p class="font-body-md text-on-surface-variant">
                Еще нет аккаунта?

<div class="flex justify-center gap-4 mt-2">
<a class="font-label-sm text-outline hover:text-primary" href="#">Политика конфиденциальности</a>

</div>

<script>
        function togglePassword() {
            const pwInput = document.getElementById('password');
            const pwIcon = document.getElementById('pw-icon');
            if (pwInput.type === 'password') {
                pwInput.type = 'text';
                pwIcon.innerText = 'visibility_off';
            } else {
                pwInput.type = 'password';
                pwIcon.innerText = 'visibility';
            }
        }

        // Lightweight atmospheric effect
        document.addEventListener('mousemove', (e) => {
            const mouseX = e.clientX / window.innerWidth;
            const mouseY = e.clientY / window.innerHeight;
            
            const cards = document.querySelectorAll('.glass-panel');
            cards.forEach(card => {
                const moveX = (mouseX - 0.5) * 10;
                const moveY = (mouseY - 0.5) * 10;
                card.style.transform = `perspective(1000px) rotateY(${moveX}deg) rotateX(${-moveY}deg)`;
            });
        });
    </script>
